name: validate
on:
  pull_request:
    paths: ['registry.json', '.github/validate.mjs']
  push:
    branches: [main]
    paths: ['registry.json', '.github/validate.mjs']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/validate.mjs
